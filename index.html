<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Global World Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <p class="eyebrow">GLOBAL COVERAGE • READ-ONLY CLOCK</p>
    <h1>Global World Clock</h1>
    <p class="sub">Thailand reference • automatic DST via IANA time zones</p>
  </div>
  <div id="base" class="base" aria-live="off"></div>
</header>
<main>
  <section class="toolbar" aria-label="Clock filters">
    <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Filter city or country…" aria-label="Filter city or country">
    <select id="region" aria-label="Filter by region"><option value="">All regions</option></select>
    <button type="button" data-mode="connected" class="active">Connected</button>
    <button type="button" data-mode="tier1">Tier 1</button>
    <button type="button" data-mode="all">All Locations</button>
  </section>
  <div class="legend"><span>★ Connected location</span><span>Thailand = reference date/time</span></div>
  <section id="grid" class="grid" aria-label="World clocks"></section>
</main>
<footer>Read-only static clock • no login • no API • no cookies • no analytics • no data submission</footer>
<script src="data/locations.js"></script>
<script src="app.js"></script>
</body>
</html>
